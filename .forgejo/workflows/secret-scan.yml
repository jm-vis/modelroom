name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install curl and python3
        run: apt-get update -qq && apt-get install -y -qq curl python3 >/dev/null

      - name: Fetch the pinned gitleaks release
        run: |
          set -eu
          version=$(tr -d '\n' < .gitleaks-version)
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks-bin/gitleaks" >> "$GITHUB_ENV"

      - name: Secret scan over every ref
        run: python3 scripts/gitleaks_gate.py full --binary "$GITLEAKS_BIN"

      - name: Tests of the scan gate
        run: |
          set -u
          export GITLEAKS_TEST_BINARY="$GITLEAKS_BIN" GITLEAKS_REQUIRED=1
          status=0
          python3 -m unittest discover -s tests -p test_gitleaks_gate.py -v > "$RUNNER_TEMP/gate-tests.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/gate-tests.txt"
          [ "$status" -eq 0 ]
          grep -Eq '^Ran [1-9][0-9]* tests?' "$RUNNER_TEMP/gate-tests.txt"
          ! grep -qi 'skipped' "$RUNNER_TEMP/gate-tests.txt"
