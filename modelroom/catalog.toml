# Shipped catalog: per family, the publisher account, its base models, which of them are the
# publisher's current models (`latest = true`, a positive statement), successor links and the
# Ollama name. Every model row names its evidence in `source`. Maintained in this repository;
# a missing statement is never evidence: a model with neither `latest` nor `successor` is shown
# with age `unknown`.
#
# The catalog is also the positive list of publishers: a search hit is resolved only when the
# account of its base model is a publisher here. Which accounts and which model rows belong in it
# was decided 2026-09-25 -- the publishers people search for, Europe first, and per family the
# lines the publisher carries today in the sizes a single machine runs (about 120B and below;
# the few larger rows are marked). Every row was read off the Hub API on 2026-09-25: the model
# page (`source`), at least one GGUF package of a listed packager or of the publisher itself, and
# for an Ollama name the manifest `registry.ollama.ai/v2/library/<base>/manifests/<tag>`
# answering 200. Where no publisher page or collection calls a model current, `latest` is left
# out and the age stays `unknown` -- a release number is no evidence.

schema_version = 1

