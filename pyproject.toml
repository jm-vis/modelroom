[project]
name = "modelroom"
version = "0.1.0"
description = "Which local model packages exist for your model families, and which of them fit your machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VISCONSULT" }]
keywords = ["local-llm", "gguf", "ollama", "huggingface", "hardware-sizing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pydantic>=2.11,<3",
    # The guided mode's terminal dialog (selection lists with check marks), MIT, on
    # prompt_toolkit (BSD). Imported only by `modelroom/dialog.py`; the three automation
    # commands and every pure module run without it. Gate for the pin: AGENTS.md,
    # "Terminal dialog library".
    "questionary>=2.1,<3",
]

[project.scripts]
modelroom = "modelroom.cli:main"

[project.urls]
Homepage = "https://vis-consult.eu"
Source = "https://github.com/jm-vis/modelroom"
Changelog = "https://github.com/jm-vis/modelroom/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelroom"]

[tool.hatch.build.targets.sdist]
# The README's screenshots live in the repository, not in the source distribution.
exclude = ["docs/screenshots/"]
include = [
    "modelroom/",
    "tests/",
    "docs/",
    "AGENTS.md",
    "CONTRACTS.md",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
