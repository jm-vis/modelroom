<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ModelRoom">
  <title>ModelRoom</title>
  <defs>
    <style>
      @font-face { font-family: 'Outfit'; font-weight: 100 900; src: url(data:font/woff;base64,) format('woff'); }
      .wm { font-family: 'Outfit', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
      .tl { font-family: 'Outfit', system-ui, sans-serif; font-weight: 500; }
      .tl4 { font-family: 'Outfit', system-ui, sans-serif; font-weight: 400; }
      .sub { font-family: 'Outfit', system-ui, sans-serif; font-weight: 400; }
      .chip { font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; }
    </style>
    <linearGradient id="tief" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#004F7C"/><stop offset="1" stop-color="#00395A"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="18" fill="url(#tief)" stroke="#8CACC9" stroke-opacity="0.35"/>
  <g transform="translate(64,62)">
    <rect x="0" y="0" width="44" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="54" y="0" width="44" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="108" y="0" width="44" height="44" rx="7" fill="#8CACC9" opacity="0.55"/>
    <rect x="162" y="0" width="44" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="0" y="54" width="44" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="54" y="54" width="44" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="108" y="54" width="44" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="163" y="55" width="42" height="42" rx="7" fill="none" stroke="#8CACC9" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="0" y="108" width="44" height="44" rx="7" fill="#8CACC9" opacity="0.55"/>
    <rect x="54" y="108" width="44" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="109" y="109" width="42" height="42" rx="7" fill="none" stroke="#8CACC9" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="163" y="109" width="42" height="42" rx="7" fill="none" stroke="#8CACC9" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <text x="330" y="128" class="wm" font-size="64" fill="#FFFFFF" text-anchor="start">ModelRoom</text>
  <text x="695" y="128" class="tl" font-size="21" fill="#8CACC9" text-anchor="start">0.3.0</text>
  <text x="330" y="176" class="tl" font-size="26" fill="#CFE1EC" text-anchor="start">Which local model packages fit your machine, Ollama, vLLM or LM Studio.</text>
  <text x="330" y="210" class="sub" font-size="19" fill="#8CACC9" text-anchor="start">Memory fit computed from the package size, llmfit as a safety net.</text>
  <g class="chip" font-size="17">
    <rect x="330" y="240" width="136" height="36" rx="8" fill="#0891B2"/>
    <text x="398.0" y="263.76" fill="#FFFFFF" text-anchor="middle">Hugging Face</text>
    <rect x="480" y="240" width="136" height="36" rx="8" fill="#455A64"/>
    <text x="548.0" y="263.76" fill="#FFFFFF" text-anchor="middle">Ollama</text>
    <rect x="630" y="240" width="136" height="36" rx="8" fill="#1B6B5C"/>
    <text x="698.0" y="263.76" fill="#FFFFFF" text-anchor="middle">vLLM</text>
    <rect x="780" y="240" width="136" height="36" rx="8" fill="#5B3F8C"/>
    <text x="848.0" y="263.76" fill="#FFFFFF" text-anchor="middle">LM Studio</text>
  </g>
</svg>
